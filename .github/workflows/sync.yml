name: Sync game events and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install sync dependency
        run: python -m pip install -r requirements.txt
      - name: Validate sync and site logic
        run: |
          python -m unittest check/sync.py check/catalog.py check/internal.py
          node --test check/sdk.mjs check/library.mjs check/hub.mjs check/internal.mjs
      - name: Restore last published snapshot
        run: python scripts/sync.py --restore
      - name: Fetch verified game data
        id: sync
        continue-on-error: true
        env:
          MS_GAME_CONFIG: ${{ secrets.MS_GAME_CONFIG }}
        run: python scripts/sync.py
      - name: Validate live data
        run: node --test check/sdk.mjs check/library.mjs check/hub.mjs
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p dist
          cp index.html events.html library.html dist/
          cp -r web dist/
          cp -r data dist/
          if [ -d assets ]; then cp -r assets dist/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report synchronization failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo 'The last verified snapshot was published. Game synchronization failed; its original timestamp is preserved.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

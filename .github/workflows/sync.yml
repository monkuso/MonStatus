name: Sync game events and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify current release and game API without publishing
        type: boolean
        default: false
      assets_only:
        description: Synchronize images using the latest verified game data
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: ${{ inputs.check_only && 'game-sync-check' || 'pages' }}
  cancel-in-progress: false
jobs:
  verify-connection:
    if: inputs.check_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify official release and current game manifest
        env:
          MS_GAME_CONFIG: ${{ secrets.MS_GAME_CONFIG }}
        run: python scripts/sync.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: sync-check
          path: data/sync-check.json
  sync-and-deploy:
    if: inputs.check_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install sync dependency
        run: python -m pip install -r requirements.txt
      - name: Validate sync and site logic
        run: |
          npm run test:sync
          npm test
      - uses: actions/github-script@v8
        id: snapshot
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            const snapshot = artifacts.find(item => item.name === 'github-pages' && !item.expired);
            if (!snapshot) throw new Error('No verified Pages snapshot is available');
            core.setOutput('artifact', String(snapshot.id));
            core.setOutput('run', String(snapshot.workflow_run.id));
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.snapshot.outputs.artifact }}
          path: snapshot
          merge-multiple: true
          run-id: ${{ steps.snapshot.outputs.run }}
          github-token: ${{ github.token }}
      - name: Restore verified data, images and asset index
        run: |
          mkdir -p previous-site assets
          tar -xf snapshot/artifact.tar -C previous-site
          test -s previous-site/data/catalog.json
          cp -r previous-site/data/. data/
          cp -r previous-site/assets/. assets/
          rm -f data/clouddeployment.json data/deployment.json
      - name: Fetch verified game data
        if: inputs.assets_only != true
        id: sync
        continue-on-error: true
        env:
          MS_GAME_CONFIG: ${{ secrets.MS_GAME_CONFIG }}
        run: python scripts/sync.py
      - name: Sync new and changed game images
        id: images
        continue-on-error: true
        env:
          MS_GAME_CONFIG: ${{ secrets.MS_GAME_CONFIG }}
          MS_ASSET_CONFIG: ${{ secrets.MS_ASSET_CONFIG }}
        run: python scripts/cloudassets.py
      - name: Validate live data
        run: |
          python scripts/prettyjson.py
          npm test
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p dist
          cp index.html internal.html dist/
          cp -r web dist/
          cp -r data dist/
          if [ -d assets ]; then cp -r assets dist/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report synchronization failure
        if: steps.sync.outcome == 'failure' || steps.images.outcome == 'failure'
        run: |
          echo 'Verified data and images were published. A synchronization step failed; check the data and image status timestamps.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

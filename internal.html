<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101217"><title>MonStatus — ゲームデータ図鑑</title><meta name="description" content="モンストの内部キャラ・クエスト定義、図鑑マスク条件、未来の公開時刻、未参照画像候補を根拠付きで探索。"><link rel="stylesheet" href="./web/hub.css"><link rel="stylesheet" href="./web/ui.css"><link rel="stylesheet" href="./web/internal.css?v=all1"><link rel="stylesheet" href="./web/master.css?v=icons2"><script type="module" src="./web/internal.js?v=icons2"></script><link rel="stylesheet" href="./web/character-image.css?v=icons2"></head>
<body>
<a class="skip" href="#internal-list">内部データ一覧へ</a>
<header class="top"><a class="brand" href="./"><span class="brand-mark">M</span>MonStatus</a><div class="top-links"><a href="./">イベント・クエスト ↗</a><a class="header-cta" href="./?tab=gacha&amp;view=internal">ガチャ内部データ ↗</a></div></header>
<main class="internal-main">
<section class="internal-hero"><span class="eyebrow">MONSTER STRIKE / COMPLETE DATA GUIDE</span><h1>モンストの情報を、<br><span>名前と画像でたどる。</span></h1><p>モンスターの能力・進化、ステージのバトル・条件・報酬、イベントの日程・特典まで。すべての配信テーブルを分類して探索。</p></section>
<nav class="internal-tabs" aria-label="内部データの種類"><button type="button" data-kind="chars" aria-pressed="true">キャラクター</button><button type="button" data-kind="stage_groups" aria-pressed="false">クエスト</button><button type="button" data-kind="stages" aria-pressed="false">ステージ</button><button type="button" data-kind="events" aria-pressed="false">イベント</button><button type="button" data-kind="items" aria-pressed="false">アイテム</button><button type="button" data-kind="assets" aria-pressed="false">画像候補</button><button type="button" data-kind="tables" aria-pressed="false">全データの種類</button></nav>
<section id="internal-list"><div class="section-head"><h2 id="internal-title">キャラクター</h2><p id="internal-count" role="status"></p></div>
<div class="filter-panel"><div class="controls"><div class="search"><input id="internal-search" type="search" aria-label="ゲームデータを検索" placeholder="名前・IDで検索"></div><select id="internal-filter" aria-label="判定根拠で絞り込む"><option value="candidate">マスク・未来・テスト</option><option value="future">公開時刻が未来</option><option value="info-mask">情報マスク条件</option><option value="test">test_flag 設定あり</option><option value="unlisted">出現一覧に参照なし</option><option value="special-range">特殊ID 26000番台</option><option value="all">すべての内部定義</option></select><select id="internal-category" aria-label="データのカテゴリ" hidden></select><select id="internal-table" aria-label="ゲームデータの種類" hidden></select><select id="internal-chunk" aria-label="データのID範囲" hidden></select></div></div>
<p id="internal-error" class="error" role="alert" hidden></p><div id="internal-grid" class="grid char-grid" aria-busy="true"></div><button id="internal-more" class="more" type="button" hidden>さらに表示する</button></section>
</main>
<dialog id="internal-detail" aria-labelledby="internal-detail-title"><div class="dialog-top"><span>INTERNAL RECORD</span><button id="internal-close" class="close" aria-label="内部データ詳細を閉じる">×</button></div><div id="internal-detail-body" class="dialog-body"></div></dialog>
<footer><a class="brand" href="./">MonStatus</a><p>非公式の内部データビューア。日時は日本時間。<br>ゲーム画像・キャラクターの権利は株式会社MIXIに帰属します。</p></footer>
</body></html>

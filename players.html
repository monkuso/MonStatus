<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101217"><title>プレイヤー検索 — MonStatus</title><link rel="stylesheet" href="./hub.css"><link rel="stylesheet" href="./ui.css"><link rel="stylesheet" href="./profile.css"><script type="module" src="./profile.js"></script></head>
<body><a class="skip" href="#player-id">検索欄へ</a><header class="top"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">M</span>MonStatus</a><div class="top-links"><a class="header-cta" href="./">← 情報ポータル</a></div></header>
<main class="player-main"><div class="player-intro"><span class="eyebrow">PLAYER SEARCH</span><h1>プレイヤーを探す。</h1><p>モンストIDから、ゲーム内で公開されている<br>名前・ランク・フレンド使用キャラを確認できます。</p></div>
<form id="player-form" class="player-search"><label for="player-id">モンストID</label><div class="player-input-row"><div class="search"><span aria-hidden="true"><svg class="search-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span><input id="player-id" type="text" inputmode="numeric" autocomplete="off" placeholder="例：551682879769" maxlength="20" required aria-describedby="id-help"></div><button id="player-submit" type="submit" class="primary-action">検索する →</button></div><p id="id-help">9桁・12桁のIDに対応。カンマや空白を含んだまま入力できます。</p></form>
<p id="player-status" class="player-status" role="status" aria-live="polite">IDを入力してプレイヤーを検索してください。</p><div id="player-error" class="error" role="alert" hidden></div><section id="player-result" aria-label="検索したプレイヤー" hidden></section>
<p class="player-footnote">フレンド申請は行いません。検索結果は公開プロフィールの情報です。</p></main>
<footer><div><a class="brand" href="./">MonStatus</a><p>非公式のモンスト情報ポータル。<br>画像・キャラクターの権利は株式会社MIXIに帰属します。</p></div><p><a href="./">スケジュール・ガチャ・クエストを見る →</a></p></footer></body></html>

services:
  - type: web
    name: monstatus-profiles
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-profile.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90 profile_service:app
    healthCheckPath: /health
    envVars:
      - key: MS_PROFILE_CONFIG
        sync: false
      - key: PROFILE_ALLOWED_ORIGIN
        value: https://monkuso.github.io
